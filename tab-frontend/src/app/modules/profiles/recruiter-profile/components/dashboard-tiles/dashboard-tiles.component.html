    <div class="stats-grid">

        <h3>{{ companiesCount }}</h3>

      </div>

      <div class="stat-box positions">
        <div class="icon"><mat-icon>group</mat-icon></div>
        <h3>{{ positionsCount }}</h3>

      <div class="stat-box candidates">
        <div class="icon"><mat-icon>person</mat-icon></div>

      <div class="stat-box success">
