<div class="universal-input">

    <button title="close button" mat-icon-button class="close-button" (click)="cancel()">
        <mat-icon>
            <svg width="1.5rem" height="1.5rem" viewBox="0 0 108 107" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M27 26.75L54 53.5L81 26.75" stroke="white" stroke-width="10" stroke-linecap="round" />
                <path d="M27 80.25L54 53.5L81 80.25" stroke="white" stroke-width="10" stroke-linecap="round" />
            </svg>
        </mat-icon>
    </button>

    <div class="user-form">
        <h2 class="padding-vertical-wide padding-horizontal-middle text-center">{{ content.userFormTitle }}</h2>
        <form [formGroup]="userForm">
            <mat-form-field appearance="fill">
                <mat-label>{{ content.txtFirstName }}</mat-label>
                <input matInput formControlName="firstname" [placeholder]="content.txtFirstName" />
                <mat-error *ngIf="userForm.get('firstname')?.hasError('required')">
                    {{ content.txtFirstNameRequired }}
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>{{ content.txtLastName }}</mat-label>
                <input matInput formControlName="lastname" [placeholder]="content.txtLastName" />
                <mat-error *ngIf="userForm.get('lastname')?.hasError('required')">
                    {{ content.txtLastNameRequired }}
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>{{ content.txtEmail }}</mat-label>
                <input matInput formControlName="email" [placeholder]="content.txtEmail" />
                <mat-error *ngIf="userForm.get('email')?.hasError('required')">{{ content.txtEmailRequired
                    }}</mat-error>
                <mat-error *ngIf="userForm.get('email')?.hasError('email')">{{ content.txtEmailInvalid }}</mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>{{ content.txtPhoneNumber }}</mat-label>
                <input matInput formControlName="phone" [placeholder]="content.txtPhoneNumber" />
                <mat-error *ngIf="userForm.get('phone')?.hasError('phone')">{{ content.txtPhoneInvalid }}</mat-error>
            </mat-form-field>

            <div class="container__flex">
                <app-role-selection (selectedRolesChange)="changeSelectedRole($event)"
                    [rolesList]="userRoles"></app-role-selection>
            </div>
        </form>

        <div mat-dialog-actions [align]="'end'" class="container__center">
            <button (click)="save()" class="button__primary-color button--medium container__center">
                {{ controlButtonContent }}
            </button>
        </div>
    </div>
</div>
