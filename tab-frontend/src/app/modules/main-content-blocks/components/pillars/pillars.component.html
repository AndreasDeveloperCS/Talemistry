<section class="values-section">
    <div class="container">
        <div class="values-grid">
            @for (value of values; track value) {
            <div class="value-card" [class]="'value-card--' + value.type">
                <div class="value-card__image-container">
                    <img [src]="value.imageUrl" [alt]="value.title + ' illustration'" class="value-card__image" />
                    <div class="value-card__overlay">
                        <span class="value-card__icon">{{ value.icon }}</span>
                    </div>
                </div>

                <div class="value-card__content">
                    <div class="value-card__header">
                        <div class="header-content">
                            <mat-icon>{{ value.icon }}</mat-icon>
                            <h3 class="value-card__title">{{ value.title }}</h3>
                        </div>
                        <div class="value-card__divider"></div>
                    </div>
                    <p class="value-card__description" *ngFor="let line of value.text">{{ line }}</p>
                    <p class="value-card__description" style="display: none;">{{ value.description }}</p>

                    <div class="value-card__actions" style="display: none;">
                        <button class="btn btn--primary" (click)="onExploreMore(value)">
                            Explore More
                        </button>
                    </div>
                </div>
            </div>

            }
        </div>

        <div class="section-footer" style="display: none;">
            <div class="cta-container">
                <h3 class="cta-title">Ready to Transform Your Recruitment?</h3>
                <p class="cta-subtitle">Join thousands of companies already using our platform</p>
                <div class="cta-actions">
                    <button class="btn btn--primary btn--large" (click)="onJoinUs()">
                        Join Us Today
                    </button>
                    <button class="btn btn--secondary btn--large" (click)="onLearnMore()">
                        Learn More
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
