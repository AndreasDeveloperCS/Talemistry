
<div class="dialog-padding container__flex container__column_gap">
    <div class="custom-dialog-title container__center dialog-header">{{content.txtConfirmation}}</div>
    <div mat-dialog-content class="custom-dialog-content container__center">
        {{data.message}}
    </div>
    <div mat-dialog-actions class="container__center container__flex">
        <button class="button-cancel button--small" (click)="cancel()">{{content.cancelText}}</button>
        <button class="button-danger button--small" (click)="confirm()">{{content.txtDelete}}</button>
    </div>
</div>
