<input matInput (keyup)="applyFilter($event)" #input placeholder="Filter">
</mat-form-field>
-->
<mat-paginator aria-sort="descending" class="paginator" [pageSize]="selectedPageSize" (page)="getServerData($event)"
  [length]="totalItems" [pageIndex]="pageIndex" [showFirstLastButtons]="true" [pageSizeOptions]="pageSizes"
  aria-label="Select page">
</mat-paginator>

<div class="mat-elevation-z8">

  <table mat-table [dataSource]="dataSource" mat-table class="table-content" matSort>


    @for (column of displayedColumns; track column) {
    <ng-container [matColumnDef]="column">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>
        <div class="header-info table-filter">
          <mat-form-field class="local-search-filter">
            <input matInput (keyup)="applyLocalFilter($event, column)" #inputLocalFilter
              [placeholder]="headerNames.get(column) ?? ''">
          </mat-form-field>
        </div>
      </th>
      <td mat-cell *matCellDef="let rowValue">{{ getValue(rowValue, column) }}</td>
    </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></tr>
    <tr mat-row *matRowDef="let rowValue; columns: displayedColumns;"></tr>

    @if (dataSource.data.length === 0) {
    <tr class="mat-row">
      <td class="mat-cell" colspan="10">
        No data matching the filter "
      </td>
    </tr>
    }
  </table>
</div>

<mat-paginator class="paginator" [pageSize]="selectedPageSize" (page)="getServerData($event)" [length]="totalItems"
  [pageIndex]="pageIndex" [showFirstLastButtons]="true" [pageSizeOptions]="pageSizes" aria-label="Select page">
</mat-paginator>
