
<button type="button" [mat-dialog-close] (click)="onClose()">
  <p>{{sourcePath | docName }}</p>

  <pdf-viewer
      [rotation]="0"
      [original-size]="true"
      [show-all]="true"
      [fit-to-page]="true"
      [zoom]="0"
      [zoom-scale]="'page-width'"
      [stick-to-page]="true"
      [render-text]="false"
      [external-link-target]="'blank'"
      [autoresize]="true"
      [show-borders]="true"
      [src]="sourcePath"
      (after-load-complete)="onPdfComplete($event)"
      (error)="onPdfError($event)"
      style="width: 100%; height: 800px"
      >
  </pdf-viewer>
</button>
