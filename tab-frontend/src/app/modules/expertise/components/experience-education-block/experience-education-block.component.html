<div class="experience-section">
  <!-- Operational Experience -->
  <h2>📋 Operational Experience</h2>
  <div class="card">
    <button class="add-btn">+ Add new Experience</button>
    <label>Company Name*</label>
    <select>
      <option>Select Company</option>
    </select>
    <button class="secondary-btn">+ Add new Position</button>

    <div class="dates">
      <input type="date">
      <input type="date">
      <input type="text" placeholder="Job Title">
    </div>

    <label><input type="checkbox"> Current</label>

    <textarea placeholder="Responsibilities"></textarea>
    <textarea placeholder="Achievements"></textarea>
  </div>

  <!-- Academic Education -->
  <h2>🎓 Academic Education</h2>
  <div class="card">
    <button class="add-btn">+ Add new Education</button>
    <select>
      <option>Educational Institution</option>
    </select>
    <input type="date">
    <label><input type="checkbox"> In progress</label>
    <input type="text" placeholder="Level of Education">
    <input type="text" placeholder="Certificate Number">
    <input type="date" placeholder="Graduation Date">
    <input type="text" placeholder="Institute / Faculty / Department">
    <input type="text" placeholder="Field of Study">
    <input type="text" placeholder="Specialization">
  </div>

  <!-- Certification -->
  <h2>📜 Certification</h2>
  <div class="card">
    <button class="add-btn">+ Add new Certification</button>
    <input type="text" placeholder="Certificate Name">
    <input type="text" placeholder="Certificate Number">
    <input type="date">
    <input type="text" placeholder="Certification Center">
    <textarea placeholder="Certificate Description"></textarea>
  </div>

  <button class="save-btn">Save All Changes</button>
</div>
