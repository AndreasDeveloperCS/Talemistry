<div class="skills-expertise">
  <h2>💡 Skills & Expertise</h2>

  <!-- Hard Skills -->
  <div class="skills-section">
    <label>Hard Skills</label>
    <div class="input-row">
      <input type="text" placeholder="Add hard skill">
      <button class="add-btn">+</button>
    </div>
    <div class="tags">
      <span class="tag">React <button>🗑</button></span>
      <span class="tag">TypeScript <button>🗑</button></span>
      <span class="tag">Node.js <button>🗑</button></span>
      <span class="tag">Python <button>🗑</button></span>
      <span class="tag">AWS <button>🗑</button></span>
      <span class="tag">Docker <button>🗑</button></span>
    </div>
  </div>

  <!-- Soft Skills -->
  <div class="skills-section">
    <label>Soft Skills</label>
    <div class="input-row">
      <input type="text" placeholder="Add soft skill">
      <button class="add-btn">+</button>
    </div>
    <div class="tags">
      <span class="tag">Leadership <button>🗑</button></span>
      <span class="tag">Communication <button>🗑</button></span>
      <span class="tag">Problem Solving <button>🗑</button></span>
      <span class="tag">Team Work <button>🗑</button></span>
    </div>
  </div>

  <!-- Managerial Skills -->
  <div class="skills-section">
    <label>Managerial Skills</label>
    <div class="input-row">
      <input type="text" placeholder="Add managerial skill">
      <button class="add-btn">+</button>
    </div>
    <div class="tags">
      <span class="tag dark">Project Management <button>🗑</button></span>
      <span class="tag dark">Team Leadership <button>🗑</button></span>
      <span class="tag dark">Strategic Planning <button>🗑</button></span>
    </div>
  </div>

  <!-- Domain Skills -->
  <div class="skills-section">
    <label>Domain Skills</label>
    <div class="input-row">
      <input type="text" placeholder="Add domain skill">
      <button class="add-btn">+</button>
    </div>
    <div class="tags">
      <span class="tag">E-commerce <button>🗑</button></span>
      <span class="tag">FinTech <button>🗑</button></span>
      <span class="tag">Healthcare <button>🗑</button></span>
      <span class="tag">SaaS <button>🗑</button></span>
    </div>
  </div>

  <!-- Languages -->
  <div class="skills-section">
    <label>Languages</label>
    <div class="input-row">
      <input type="text" placeholder="Add language (e.g., Spanish (Fluent))">
      <button class="add-btn">+</button>
    </div>
    <div class="tags">
      <span class="tag orange">English (Native) <button>🗑</button></span>
      <span class="tag orange">Spanish (Fluent) <button>🗑</button></span>
      <span class="tag orange">French (Intermediate) <button>🗑</button></span>
    </div>
  </div>
</div>
