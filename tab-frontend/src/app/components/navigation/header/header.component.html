@if(showHeader$ | async) {
<div class="navbar">
    <div class="logo" (click)="onMainPage()">
        <svg width="36" height="36" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <path d="M20 5 L32 12 L32 27 L20 34 L8 27 L8 12 Z" stroke="#126f66" stroke-width="1.4" stroke-linejoin="round" opacity="0.55" />
          <circle cx="20" cy="5" r="3" fill="#24af4f" />
          <circle cx="32" cy="12" r="2.6" fill="#126f66" />
          <circle cx="32" cy="27" r="2.6" fill="#383c5b" />
          <circle cx="20" cy="34" r="3" fill="#24af4f" />
          <circle cx="8" cy="27" r="2.6" fill="#383c5b" />
          <circle cx="8" cy="12" r="2.6" fill="#126f66" />
          <circle cx="20" cy="20" r="3.4" fill="#0b1b2a" />
          <circle cx="20" cy="20" r="1.4" fill="#ae0301" />
        </svg>
        <span class="logo-txt">TALEMISTRY</span>
    </div>
    <div class="container container__flex container__right nav-controls">
        <button class="career-btn" (click)="onPositions()">
            <mat-icon>search</mat-icon>
            <span class="career-lbl">JOB SEARCH</span>
        </button>
        <app-theme-switcher></app-theme-switcher>
        @if(!(isLoggedIn$ | async)) {
        <div class="actions">
            <button class="login-btn" (click)="onLogin()">
                <mat-icon>lock_open</mat-icon>
                <span class="btn-lbl">Login</span>
            </button>
            <button class="cta-btn" (click)="onRegistration()">
                <mat-icon>rocket_launch</mat-icon>
                <span class="btn-lbl">Get Started</span>
            </button>
        </div>
        }
        @else if(isLoggedIn$ | async) {
        <div class="login-block">
            <app-login-field></app-login-field>
            <button (click)="logOut()" class="logout-btn">
                <mat-icon>exit_to_app</mat-icon>
            </button>
        </div>
        }
    </div>
</div>
}
