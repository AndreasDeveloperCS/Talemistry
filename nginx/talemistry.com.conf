server {
    server_name talemistry.com;
    listen 159.198.66.15:443 ssl;

    ssl_certificate /etc/letsencrypt/live/talemistry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talemistry.com/privkey.pem;

    charset utf-8;
    gzip on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/css text/xml application/javascript text/plain application/json image/svg+xml image/x-icon;
    gzip_comp_level 1;

    set $root_path /var/www/talemistry;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        include /etc/nginx/proxy_params;
    }

    # Next.js API routes run on the frontend process.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        include /etc/nginx/proxy_params;
    }

    # Backend Socket.IO/WebSocket endpoints run on port 4000.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/proxy_params;
    }

    location /api/socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/proxy_params;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/proxy_params;
    }

    location /sockets/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/proxy_params;
    }

    location ~* ^.+\.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpeg|avi|zip|gz|bz2|rar|swf|ico|7z|doc|docx|map|otf|pdf|tff|tif|txt|wav|webp|woff|woff2|xls|xlsx|xml)$ {
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        proxy_pass http://127.0.0.1:81;
        proxy_redirect http://127.0.0.1:81/ /;
        include /etc/nginx/proxy_params;
        include /etc/nginx/mime.types;
    }

    include "/etc/nginx/fastpanel2-sites/talemistry_org_usr/talemistry.com.includes";
    include /etc/nginx/fastpanel2-includes/*.conf;
    error_log /var/www/logs/talemistry/talemistry.com-frontend.error.log;
    access_log /var/www/logs/talemistry/talemistry.com-frontend.access.log;
}

server {
    server_name talemistry.com;
    listen 159.198.66.15:80;
    return 301 https://$host$request_uri;

    error_log /var/www/logs/talemistry/talemistry.com-frontend.error.log;
    access_log /var/www/logs/talemistry/talemistry.com-frontend.access.log;
}

server {
    server_name www.talemistry.com;
    listen 159.198.66.15:80;
    listen 159.198.66.15:443 ssl;

    ssl_certificate /etc/letsencrypt/live/talemistry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talemistry.com/privkey.pem;

    return 301 $scheme://talemistry.com$request_uri;

    error_log /var/www/logs/talemistry/talemistry.com-frontend.error.log;
    access_log /var/www/logs/talemistry/talemistry.com-frontend.access.log;
     # make sure that both application nextjs on port 3000 and nestjs on port 4000 are running after deployment based on github actions
}