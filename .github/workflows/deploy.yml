name: Deploy Talemistry

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: talemistry-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - talemistry

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use supported Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show environment
        run: |
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          node -v
          npm -v
          pm2 -v

      - name: Deploy files
        run: |
          APP_PATH="${{ vars.APP_PATH }}"

          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            echo "Using passwordless sudo to prepare deploy directory"
            sudo mkdir -p "$APP_PATH"
            sudo chown -R "$(id -u):$(id -g)" "$APP_PATH"
          else
            mkdir -p "$APP_PATH"
          fi

          if [ ! -w "$APP_PATH" ]; then
            echo "Deploy path is not writable by runner user: $APP_PATH"
            ls -ld "$APP_PATH" || true
            id || true
            exit 1
          fi

          rsync -az --delete --no-owner --no-group --no-perms \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude=".next" \
            --exclude=".env" \
            --exclude=".env.local" \
            --exclude=".env.production" \
            --exclude="backend/config.json" \
            --exclude="backend/google.api.calendar-*.json" \
            --exclude="backend/client_certs" \
            --exclude="backend/ssl" \
            --exclude="backend/cloudfront/private_key.pem" \
            ./ "$APP_PATH/"

      - name: Install dependencies
        working-directory: ${{ vars.APP_PATH }}
        run: npm ci

      - name: Build Next.js
        working-directory: ${{ vars.APP_PATH }}
        run: npm run build

      - name: Start or restart application
        working-directory: ${{ vars.APP_PATH }}
        run: |
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            pm2_cmd() { sudo -n -E env "PATH=$PATH" PM2_HOME=/root/.pm2 pm2 "$@"; }
          else
            pm2_cmd() { pm2 "$@"; }
          fi

          pm2_cmd delete talemistry-web || true
          PORT=3000 HOSTNAME=0.0.0.0 pm2_cmd start npm \
            --name talemistry-web \
            -- start -- -p 3000 -H 0.0.0.0

          pm2_cmd save
          pm2_cmd status talemistry-web

      - name: Install backend dependencies
        working-directory: ${{ vars.APP_PATH }}/backend
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "No lockfile found in backend; falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: Build NestJS backend
        working-directory: ${{ vars.APP_PATH }}/backend
        run: npm run build

      - name: Start or reload backend
        working-directory: ${{ vars.APP_PATH }}/backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_STARTER_MONTHLY: ${{ secrets.STRIPE_PRICE_STARTER_MONTHLY }}
          STRIPE_PRICE_STARTER_YEARLY: ${{ secrets.STRIPE_PRICE_STARTER_YEARLY }}
          STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${{ secrets.STRIPE_PRICE_PROFESSIONAL_MONTHLY }}
          STRIPE_PRICE_PROFESSIONAL_YEARLY: ${{ secrets.STRIPE_PRICE_PROFESSIONAL_YEARLY }}
        run: |
          set -euo pipefail

          stripe_value_available() {
            local variable="$1"
            if [ -n "${!variable:-}" ]; then
              return 0
            fi

            grep -Eq "^[[:space:]]*${variable}[[:space:]]*=[[:space:]]*['\"]?[^[:space:]'\"]+" .env 2>/dev/null
          }

          for variable in STRIPE_SECRET_KEY STRIPE_PUBLISHABLE_KEY STRIPE_WEBHOOK_SECRET; do
            if ! stripe_value_available "$variable"; then
              echo "Required Stripe value is missing from GitHub Actions secrets and backend/.env: ${variable}"
              exit 1
            fi
          done

          echo "Stripe deployment variables are configured from GitHub Actions secrets or backend/.env"

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "GitHub Actions OpenAI secret is missing; PM2 will use the server-side environment value if configured"
          else
            echo "OpenAI API key supplied from GitHub Actions secret"
          fi

          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            pm2_cmd() { sudo -n -E env "PATH=$PATH" PM2_HOME=/root/.pm2 pm2 "$@"; }
          else
            pm2_cmd() { pm2 "$@"; }
          fi

          # Clean up legacy process names from older manual deployments.
          pm2_cmd delete EVRYKA || true

          pm2_cmd startOrReload ecosystem.config.js --update-env
          pm2_cmd save
          pm2_cmd status TALEMISTRY

      - name: Verify PM2 processes are online
        run: |
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            pm2_cmd() { sudo -n -E env "PATH=$PATH" PM2_HOME=/root/.pm2 pm2 "$@"; }
          else
            pm2_cmd() { pm2 "$@"; }
          fi

          for app in talemistry-web TALEMISTRY; do
            echo "Waiting for PM2 app: ${app}"
            for i in {1..15}; do
              if pm2_cmd describe "$app" | grep -q "status.*online"; then
                echo "${app} is online"
                break
              fi

              if [ "$i" -eq 15 ]; then
                echo "${app} failed to reach online state"
                pm2_cmd describe "$app" || true
                pm2_cmd logs "$app" --lines 80 --nostream || true
                exit 1
              fi

              sleep 2
            done
          done

          pm2_cmd list

      - name: Inject frontend secrets
        working-directory: ${{ vars.APP_PATH }}/tab-frontend
        run: |
          sed -i \
            -e "s|__GOOGLE_CLIENT_SECRET__|${{ secrets.GOOGLE_CLIENT_SECRET }}|g" \
            -e "s|__GOOGLE_CLIENT_ID__|${{ secrets.GOOGLE_CLIENT_ID }}|g" \
            -e "s|__GOOGLE_API_KEY__|${{ secrets.GOOGLE_API_KEY }}|g" \
            -e "s|__FACEBOOK_CLIENT_ID__|${{ secrets.FACEBOOK_CLIENT_ID }}|g" \
            -e "s|__LINKEDIN_CLIENT_ID__|${{ secrets.LINKEDIN_CLIENT_ID }}|g" \
            -e "s|__LINKEDIN_CLIENT_SECRET__|${{ secrets.LINKEDIN_CLIENT_SECRET }}|g" \
            -e "s|__POSTHOG_KEY__|${{ secrets.POSTHOG_KEY }}|g" \
            -e "s|__WORKABLE_ACCESS_TOKEN__|${{ secrets.WORKABLE_ACCESS_TOKEN }}|g" \
            src/environments/environment.prod.ts

      - name: Install Angular dependencies
        working-directory: ${{ vars.APP_PATH }}/apps/angular
        run: npm ci

      - name: Build Angular UI
        working-directory: ${{ vars.APP_PATH }}/apps/angular
        run: npm run build

      - name: Verify application
        run: |
          sleep 5
          curl --fail --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000 >/dev/null
          echo "Talemistry is responding on port 3000"

          for i in {1..10}; do
            if bash -c '>/dev/tcp/127.0.0.1/4000' 2>/dev/null; then
              echo "Backend is listening on port 4000"
              exit 0
            fi
            sleep 2
          done

          echo "Backend failed to listen on port 4000"
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            pm2_cmd() { sudo -n -E env "PATH=$PATH" PM2_HOME=/root/.pm2 pm2 "$@"; }
          else
            pm2_cmd() { pm2 "$@"; }
          fi

          pm2_cmd describe TALEMISTRY || true
          pm2_cmd logs TALEMISTRY --lines 80 --nostream || true
          exit 1
